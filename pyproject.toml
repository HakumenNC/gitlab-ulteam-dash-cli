[project]
name = "gl-team-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "soutartronny@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-gitlab>=8.5.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
gl-team-cli = "gl_team_cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "questionary.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
